packages:
  - app
  - aggregator

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@^0.1.24
  vite-plus: latest
  react: ^19.2.7
  react-dom: ^19.2.7
  "@vitejs/plugin-react": ^6.0.2
  tailwindcss: ^4.3.0
  "@tailwindcss/vite": ^4.3.0
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  hono: ^4.12.23
  "@hono/node-server": ^2.0.4
  tsx: ^4.22.4
  "@cloudflare/vite-plugin": ^1.40.0
  wrangler: ^4.98.0
  "@tanstack/react-query": ^5.101.0
  cloudflare: ^5.2.0
  "@google/genai": ^2.8.0
  aggregator: ^0.1.2
  zod: ^4.4.3
  effect: ^3.21.3
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  "@google/genai": set this to true or false
  esbuild: set this to true or false
  protobufjs: set this to true or false
  sharp: set this to true or false
  workerd: set this to true or false
