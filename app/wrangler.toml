name = "prism"
compatibility_date = "2026-06-08"
main = "backend/index.ts"

[vars]
AI_API_KEY = ""
# Actual value set via .dev.vars (local) or `wrangler secret put AI_API_KEY` (production)

[ai]
binding = "AI"
remote = true

[[vectorize]]
binding = "VECTORIZE"
index_name = "prism-index"
remote = true

[[workflows]]
binding = "PRISM_ENCODE_WORKFLOW"
name = "prism-encode-workflow"
class_name = "PrismEncodeWorkflow"

[assets]
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
